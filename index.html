<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Primary Meta Tags -->
        <title>Phan Tiến Đạt | Creative Developer & Designer | Portfolio</title>
        <meta name="title" content="Phan Tiến Đạt | Creative Developer & Designer | Portfolio" />
        <meta
            name="description"
            content="Phan Tiến Đạt - Frontend Developer based in Ho Chi Minh City, Vietnam. Specializing in React, Angular, Tailwind CSS, UI engineering, and modern web applications. 3+ years of experience."
        />
        <meta
            name="keywords"
            content="Phan Tiến Đạt, portfolio, web developer, frontend developer, React, Angular, JavaScript, Tailwind CSS, UI engineering, Vietnam"
        />
        <meta name="author" content="Phan Tiến Đạt" />
        <meta name="robots" content="index, follow" />
        <meta name="language" content="English" />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://portfolio.com/" />
        <meta property="og:title" content="Phan Tiến Đạt | Creative Developer & Designer" />
        <meta
            property="og:description"
            content="Building modern, responsive web applications with React, Angular, Tailwind CSS, and clean frontend architecture. Based in Ho Chi Minh City, Vietnam."
        />
        <meta property="og:image" content="/og-image.png" />

        <!-- Twitter -->
        <meta property="twitter:card" content="summary_large_image" />
        <meta property="twitter:url" content="https://portfolio.com/" />
        <meta property="twitter:title" content="Phan Tiến Đạt | Creative Developer & Designer" />
        <meta
            property="twitter:description"
            content="Building modern, responsive web applications with React, Angular, Tailwind CSS, and clean frontend architecture."
        />
        <meta property="twitter:image" content="/og-image.png" />

        <!-- Theme Color — sync with terminal background (#0a0a0a) -->
        <meta name="theme-color" content="#0a0a0a" />
        <meta name="msapplication-TileColor" content="#0a0a0a" />

        <!-- Canonical URL -->
        <link rel="canonical" href="https://portfolio.com/" />

        <!-- Fonts — Fira Code (monospace). preload+display=swap to avoid FOUT/FOIT -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="preload"
            as="style"
            href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap"
        />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap"
        />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
